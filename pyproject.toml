[project]
name = "mcpdf"
version = "0.1.0"
description = "MCP server that indexes and searches PDFs using a local OpenAI-compatible embeddings endpoint"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wgriffin", email = "wgriffin@fraktured.net" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[project.scripts]
mcpdf = "mcpdf.server:main"
mcpdf-index = "mcpdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpdf"]

[tool.uv]
# The framework Python from python.org disables sqlite3 extension loading,
# which sqlite-vec needs. Force uv-managed Python (python-build-standalone)
# which ships with extension loading enabled.
managed = true
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
