# mcpdf Worker — one deployment per corpus.
#
# A "corpus" is the triple (Vectorize index, D1 database, deployed Worker URL).
# Each corpus is isolated: own URL, own data, own auth token, own DO state.
#
# Every corpus lives under its own [env.X] block. There is no top-level
# corpus — `wrangler deploy` without `--env <name>` deliberately errors.
# Bindings are NOT inherited from top-level into [env.X] blocks (wrangler
# design choice), so each env block redeclares everything it needs.
#
# To add a corpus:
#   1. Copy one of the [env.X] blocks below and rename `X` throughout
#   2. wrangler vectorize create <name> --dimensions=768 --metric=cosine
#   3. wrangler d1 create <name>          (paste UUID into database_id)
#   4. wrangler deploy --env <name>

main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# === studio ===

[env.studio]
name = "studio"

[env.studio.ai]
binding = "AI"

[[env.studio.vectorize]]
binding = "VECTORIZE"
index_name = "studio"

[[env.studio.d1_databases]]
binding = "DB"
database_name = "studio"
database_id = "d4db684a-63b6-440a-b755-5c8f1cad5c26"

[[env.studio.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "McpdfAgent"

[[env.studio.migrations]]
tag = "v1"
new_sqlite_classes = ["McpdfAgent"]

# OAuth provider state (auth codes, tokens, registered clients) AND
# single-use magic-link tokens (`magic:<uuid>` keys with 10 min TTL).
# Provision once with: wrangler kv namespace create OAUTH_KV --env studio
# Paste the printed id below.
[[env.studio.kv_namespaces]]
binding = "OAUTH_KV"
id = "35a696dee2024c7aa087c0f9d3370a4a"

# Cloudflare Send Email binding for magic-link auth. `destination_address`
# must be a verified Email Routing destination on a domain bound to this
# account, and must match `OWNER_EMAIL` below — Cloudflare enforces the
# allowlist at the runtime layer.
[[env.studio.send_email]]
name = "SEND_EMAIL"
destination_address = "wgriffin@fraktured.net"

[env.studio.vars]
# Shown by claude.ai as the connector's server name.
CORPUS_NAME = "studio"
# Recipient for sign-in links. Must match destination_address above.
OWNER_EMAIL = "wgriffin@fraktured.net"
# Sender for sign-in emails. Must live on a domain this account controls
# (no verification needed for the From address itself, only the destination).
MAIL_FROM = "wgriffin@fraktured.net"

