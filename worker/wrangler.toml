# mcpdf Worker — one deployment per corpus.
#
# A "corpus" is the triple (Vectorize index, D1 database, deployed Worker URL).
# Each corpus is isolated: own URL, own data, own auth token, own DO state.
#
# Every corpus lives under its own [env.X] block. There is no top-level
# corpus — `wrangler deploy` without `--env <name>` deliberately errors.
# Bindings are NOT inherited from top-level into [env.X] blocks (wrangler
# design choice), so each env block redeclares everything it needs.
#
# To add a corpus:
#   1. Copy one of the [env.X] blocks below and rename `X` throughout
#   2. wrangler vectorize create <name> --dimensions=768 --metric=cosine
#   3. wrangler d1 create <name>          (paste UUID into database_id)
#   4. wrangler deploy --env <name>

main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true


# === studio ===
[env.studio]
name = "studio"

[env.studio.ai]
binding = "AI"

[[env.studio.vectorize]]
binding = "VECTORIZE"
index_name = "studio"

[[env.studio.d1_databases]]
binding = "DB"
database_name = "studio"
database_id = "d4db684a-63b6-440a-b755-5c8f1cad5c26"

[[env.studio.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "McpdfAgent"

[[env.studio.migrations]]
tag = "v1"
new_sqlite_classes = ["McpdfAgent"]

[[env.studio.kv_namespaces]]
binding = "OAUTH_KV"
id = "35a696dee2024c7aa087c0f9d3370a4a"

[env.studio.vars]
CORPUS_NAME = "studio"
OWNER_EMAIL = "wgriffin@fraktured.net"


# === cpr ===
[env.cpr]
name = "cpr"

[env.cpr.ai]
binding = "AI"

[[env.cpr.vectorize]]
binding = "VECTORIZE"
index_name = "cpr"

[[env.cpr.d1_databases]]
binding = "DB"
database_name = "cpr"
database_id = "ada0c289-e459-4eaa-a9da-1cfc8cc2895d"

[[env.cpr.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "McpdfAgent"

[[env.cpr.migrations]]
tag = "v1"
new_sqlite_classes = ["McpdfAgent"]

[[env.cpr.kv_namespaces]]
binding = "OAUTH_KV"
id = "03fa000e58fb48a19d3e2ca93ae63a8d"

[env.cpr.vars]
CORPUS_NAME = "cpr"
OWNER_EMAIL = "wgriffin@fraktured.net"
